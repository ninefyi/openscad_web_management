name = "openscad-web-management"
pages_build_output_dir = "dist"
compatibility_date = "2026-09-01"

# Created by `npx wrangler d1 create openscad-web-management` — paste the real
# database_id it prints back here before deploying. Local dev doesn't need it
# (Wrangler runs D1 against a local SQLite file automatically).
[[d1_databases]]
binding = "DB"
database_name = "openscad-web-management"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# Created by `npx wrangler r2 bucket create openscad-web-management-thumbnails`.
[[r2_buckets]]
binding = "THUMBNAILS"
bucket_name = "openscad-web-management-thumbnails"

[vars]
ENVIRONMENT = "production"
# From your Cloudflare Zero Trust Access application, after you create it —
# see docs/v2-deploy.md. Required for the admin API's JWT verification.
ACCESS_TEAM_DOMAIN = "REPLACE_WITH_YOUR_TEAM.cloudflareaccess.com"
ACCESS_AUD = "REPLACE_WITH_ACCESS_APP_AUD_TAG"
