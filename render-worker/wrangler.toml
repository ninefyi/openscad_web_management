name = "openscad-render-worker"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# This Worker is a queue consumer, not a public HTTP endpoint — no route to expose.
workers_dev = false
preview_urls = false

# The actual render engine — native OpenSCAD in a container (see
# container/Dockerfile), not the WASM build the frontend uses. Sized for
# a worst-case burst of ~100 concurrent renders with queueing acceptable
# (see docs/adr/0014-render-container-capacity.md) — standard-4 specifically
# because OpenSCAD's TBB-based Manifold parallelism needs >=2 real cores to
# show any speedup at all (a smaller "1 vCPU" tier measured identically to
# the original 1/16-vCPU one); 4 real cores measured ~7x faster on this
# library's worst-case Minkowski-heavy Template (120s -> 18s), and 25
# instances clears a 100-job burst in a handful of queued rounds rather
# than one at a time, while still bounding worst-case spend rate (no
# platform-level hard cost cap exists — see the same ADR).
[[containers]]
image = "./container/Dockerfile"
class_name = "RenderContainer"
instance_type = "standard-4"
max_instances = 25

[[durable_objects.bindings]]
name = "RENDER_CONTAINER"
class_name = "RenderContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RenderContainer"]

# Consumes the queue the main Pages project (../wrangler.toml) produces to —
# Pages Functions can't be a queue consumer, which is the whole reason this
# is a separate Worker project instead of living in functions/.
[[queues.consumers]]
queue = "render-jobs"
max_batch_size = 1
max_retries = 2

# Same D1 database and R2 bucket as the main project — shared resources,
# not project-exclusive. Paste the real database_id (same value as in
# ../wrangler.toml) before deploying.
[[d1_databases]]
binding = "DB"
database_name = "openscad-web-management"
database_id = "1889bb26-3f2e-4c9a-bef0-8351f45d587e"

[[r2_buckets]]
binding = "THUMBNAILS"
bucket_name = "openscad-web-management-thumbnails"
